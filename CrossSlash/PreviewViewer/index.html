<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossSlash model preview</title>
  </head>
  <body>
    <main id="viewer">
      <canvas id="model-canvas" aria-label="3D model preview"></canvas>
      <div id="empty-state">Choose a model to preview</div>

      <div id="model-label" aria-live="polite">
        <span id="model-name"></span>
        <span id="animation-label" hidden></span>
      </div>
      <button id="pop-out-button" type="button" aria-label="Pop out preview" title="Open preview in a resizable window">⤢</button>

      <section id="controls" aria-label="Animation controls">
        <div class="control-row">
          <button id="play-button" type="button" disabled>Play</button>
          <button id="reset-button" type="button" disabled>Reset</button>
          <button id="edit-lights-button" type="button">Edit lights…</button>
        </div>
        <div class="control-row timeline-row">
          <input id="timeline" type="range" min="0" max="1000" value="0" disabled aria-label="Animation position" />
          <span id="time-label">0.00 / 0.00 s</span>
          <select id="speed-select" aria-label="Playback speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </div>
        <div id="field-lighting-row" class="control-row" hidden>
          <div id="field-picker" class="searchable-dropdown">
            <input id="field-search" type="text" placeholder="Search scenes…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="field-options" />
            <button id="field-toggle" class="dropdown-toggle" type="button" aria-label="Show field scenes" aria-expanded="false">▾</button>
            <div id="field-options" class="dropdown-options" role="listbox" hidden></div>
          </div>
          <div id="lighting-model-picker" class="searchable-dropdown">
            <input id="lighting-model-search" type="text" placeholder="Search lighting models…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="lighting-model-options" />
            <button id="lighting-model-toggle" class="dropdown-toggle" type="button" aria-label="Show lighting models" aria-expanded="false">▾</button>
            <div id="lighting-model-options" class="dropdown-options" role="listbox" hidden></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
